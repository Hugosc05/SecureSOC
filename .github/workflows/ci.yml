name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: securesoc
          POSTGRES_USER: securesoc
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U securesoc -d securesoc"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SECURESOC_ENVIRONMENT: test
      SECURESOC_DB_HOST: localhost
      SECURESOC_DB_PORT: "5433"
      POSTGRES_DB: securesoc
      POSTGRES_USER: securesoc
      POSTGRES_PASSWORD: ci-only-password
      SECURESOC_REQUIRE_DB: "1"   # integration tests must fail, not skip
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=securesoc --cov-report=term-missing

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Security (dependencies, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Python dependency audit
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o /tmp/requirements.txt
          uvx pip-audit --strict -r /tmp/requirements.txt
      - name: npm dependency audit
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose build